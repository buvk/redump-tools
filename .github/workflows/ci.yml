name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3
      - name: Normalize Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($IsWindows) { "$PWD\.venv\Scripts" >> $env:GITHUB_PATH }
          else { "$PWD/.venv/bin" >> $env:GITHUB_PATH }
      - run: python -m pip install -e ".[dev,desktop]"
      - run: python -m ruff check .
      - run: python -m pyright
      - run: python -m unittest discover -s tests -p "test_*.py"
